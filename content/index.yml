faq:
  title: Sıkça Sorulan Sorular
  description: METAMENTE hakkında sıkça sorulan soruların cevaplarını keşfedin.
  items:
    - label: Deney setleri neler içerir?
      content: Deney setlerimiz, genellikle ahşap ve plastik parçalardan oluşur. İçeriğe bağlı olarak, farklı modeller ve projeler oluşturmak için gerekli tüm bileşenleri içerebilirler. Ayrıca, talimatlar ve bazen ek malzemeler de bulunabilir.
      defaultOpen: true
    - label: Bu ürünler çocuklar için hangi yaş aralığına uygun?
      content: Deney setlerimiz, genellikle farklı yaş gruplarına yönelik varyasyonlar sunar. Bu nedenle, çocukların yaşlarına ve beceri seviyelerine uygun olanları seçmek önemlidir. Genellikle 6 yaş ve üzeri çocuklar için uygundur.
    - label: Ürünlerin kullanımı ve montajı kolay mıdır?
      content: Evet, ürünlerimizin kullanımı ve montajı genellikle basittir. Talimatlarla birlikte gelirler ve çocukların kolayca anlayabileceği şekilde tasarlanır. Ayrıca, çocukların kendi başlarına projeleri yapmalarına veya aileleri ile birlikte çalışmalarına olanak tanır.
    - label: Ürünlerin eğitim değeri nedir? Çocuklarım hangi becerileri geliştirebilirler?
      content: Ürünlerimizin eğitim değeri oldukça yüksektir. Çocuklar, bu deney setleri ile bilimsel düşünme, problem çözme, el becerileri, takım çalışması ve yaratıcılık gibi birçok önemli beceriyi geliştirebilirler. Ayrıca, fen bilimleri ve mühendislik alanlarına ilgi duymalarını teşvik ederler.
    - label: Ürünlerinizin güvenliği ve malzeme kalitesi hakkında bilgi verebilir misiniz?
      content: Ürünlerimizin tasarımı, güvenliği ve malzeme kalitesi önceliklidir. Genellikle toksik olmayan, dayanıklı malzemeler kullanırız ve ulusal güvenlik standartlarına uyarız. Ayrıca, ürünlerimizin çocuklar için güvenli ve eğlenceli olmasını sağlamak için sürekli olarak kalite kontrolü yaparız.
